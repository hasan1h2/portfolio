<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#050816" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#00E5FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="600" height="600" fill="url(#bgGrad)" rx="300"/>
  <circle cx="300" cy="300" r="280" fill="url(#glowGrad)"/>

  <!-- Orbital Cyber Rings -->
  <circle cx="300" cy="300" r="250" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="15 10" opacity="0.6"/>
  <circle cx="300" cy="300" r="220" fill="none" stroke="#7B61FF" stroke-width="1.5" stroke-dasharray="30 15" opacity="0.4"/>

  <!-- Developer Silhouette Artwork -->
  <g transform="translate(150, 120)">
    <!-- Shield / Hexagon Frame -->
    <path d="M 150 10 L 270 80 L 270 240 L 150 310 L 30 240 L 30 80 Z" fill="rgba(15, 23, 42, 0.7)" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Code Brackets Icon -->
    <path d="M 90 140 L 50 175 L 90 210" fill="none" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 210 140 L 250 175 L 210 210" fill="none" stroke="#00FFA3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="165" y1="130" x2="135" y2="220" stroke="#7B61FF" stroke-width="8" stroke-linecap="round"/>

    <!-- Flutter Flutter Wing Motif -->
    <path d="M 150 70 L 200 120 L 150 170 L 100 120 Z" fill="url(#primaryGrad)" opacity="0.25"/>
  </g>

  <!-- Avatar Outer Ring -->
  <circle cx="300" cy="300" r="285" fill="none" stroke="url(#primaryGrad)" stroke-width="4"/>

  <!-- Name Watermark Text -->
  <text x="300" y="520" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">HABIB HASAN</text>
  <text x="300" y="550" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#00FFA3" text-anchor="middle" letter-spacing="2">FLUTTER &amp; FULL STACK DEVELOPER</text>
</svg>
