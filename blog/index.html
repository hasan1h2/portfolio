<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Technical Blog & Knowledge Hub - Habib Hasan | Flutter, WebGL, Architecture & Engineering">
  <title>Blog & Knowledge Hub | Habib Hasan</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Design System CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-theme="dark">

  <!-- Navigation -->
  <header class="site-header scrolled">
    <div class="container-fluid flex-between">
      <a class="header-brand" href="../index.html">
        <div class="header-brand-logo">HH</div>
        <div>
          <span>HABIB HASAN</span>
          <span class="badge-ds badge-ds-primary ms-2">Blog</span>
        </div>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="header-nav-link active">Articles</a>
        <a href="categories.html" class="header-nav-link">Categories</a>
        <a href="tags.html" class="header-nav-link">Tags</a>
        <a href="../index.html" class="btn-ds btn-ds-outline btn-sm ms-2"><i class="bi bi-arrow-left"></i> Portfolio</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container-fluid" style="padding-top: 120px; padding-bottom: 80px;">
    
    <!-- Hero Banner -->
    <div class="glass-card p-5 mb-5 text-center">
      <span class="section-title-badge"><i class="bi bi-journal-code"></i> Engineering Articles & Insights</span>
      <h1 class="display-lg gradient-text mb-3">Blog & Knowledge Hub</h1>
      <p class="body-lg text-secondary mx-auto mb-4" style="max-width: 700px;">
        In-depth technical tutorials, architecture blueprints, performance optimization techniques, and creative WebGL insights.
      </p>

      <!-- Live Search Box -->
      <div class="search-box-ds mx-auto" style="max-width: 550px;">
        <i class="bi bi-search search-icon"></i>
        <input type="text" id="blogSearchInput" class="form-control-ds" placeholder="Search articles by title, tag, or topic...">
      </div>
    </div>

    <!-- Category Pills -->
    <div class="d-flex justify-content-center flex-wrap gap-2 mb-5" id="categoryPills">
      <button class="portfolio-filter-btn active" data-category="all">All Articles</button>
      <button class="portfolio-filter-btn" data-category="mobile-development">Mobile Dev</button>
      <button class="portfolio-filter-btn" data-category="web-engineering">Web Engineering</button>
      <button class="portfolio-filter-btn" data-category="ui-ux-design">UI/UX Design</button>
    </div>

    <!-- Articles Grid -->
    <div class="row g-4" id="articlesGrid">
      <!-- Dynamically Populated by BlogLoader -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/blog-loader.js"></script>
  <script src="../assets/js/blog-search.js"></script>
  <script src="../assets/js/blog-filter.js"></script>
  <script src="../assets/js/theme-engine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const posts = await BlogLoader.getPosts();
      const grid = document.querySelector('#articlesGrid');
      
      if (posts && grid) {
        BlogSearchEngine.renderFilteredPosts(posts, grid);
        BlogSearchEngine.init(document.querySelector('#blogSearchInput'), grid, posts);

        // Bind Category Pills
        document.querySelectorAll('#categoryPills button').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#categoryPills button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cat = btn.getAttribute('data-category');
            const filtered = BlogFilterEngine.filterByCategory(posts, cat);
            BlogSearchEngine.renderFilteredPosts(filtered, grid);
          });
        });
      }
    });
  </script>
</body>
</html>
