<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Categories | Habib Hasan Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-theme="dark">
  <header class="site-header scrolled">
    <div class="container-fluid flex-between">
      <a class="header-brand" href="../index.html">
        <div class="header-brand-logo">HH</div>
        <div><span>HABIB HASAN</span><span class="badge-ds badge-ds-primary ms-2">Categories</span></div>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="header-nav-link">Articles</a>
        <a href="categories.html" class="header-nav-link active">Categories</a>
        <a href="tags.html" class="header-nav-link">Tags</a>
        <a href="../index.html" class="btn-ds btn-ds-outline btn-sm"><i class="bi bi-arrow-left"></i> Portfolio</a>
      </div>
    </div>
  </header>

  <div class="container-fluid" style="padding-top: 120px; padding-bottom: 80px;">
    <div class="glass-card p-5 mb-5 text-center">
      <h1 class="display-lg gradient-text mb-3">Browse by Category</h1>
      <p class="body-lg text-secondary">Explore technical articles grouped by engineering discipline.</p>
    </div>
    <div class="row g-4" id="categoriesGrid"></div>
  </div>

  <script src="../assets/js/blog-loader.js"></script>
  <script src="../assets/js/theme-engine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const categories = await BlogLoader.getCategories();
      const grid = document.querySelector('#categoriesGrid');
      if (categories && grid) {
        grid.innerHTML = categories.map(cat => `
          <div class="col-md-6 col-xl-4 mb-4">
            <div class="glass-card p-4 h-100">
              <div class="card-service__icon mb-3"><i class="bi ${cat.icon}"></i></div>
              <h4>${cat.name}</h4>
              <p class="body-sm text-secondary mb-4">${cat.description}</p>
              <a href="index.html?category=${cat.slug}" class="btn-ds btn-ds-primary btn-sm">View Articles <i class="bi bi-arrow-right"></i></a>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
